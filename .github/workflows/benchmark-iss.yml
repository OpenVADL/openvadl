name: Benchmark ISS

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'vadl/main/vadl/iss/**'
      - 'vadl/test/vadl/iss/**'
      - 'sys/**'

permissions:
  contents: read
  actions: write
  checks: write

jobs:
  aarch32:
    uses: ./.github/workflows/reusable-benchmark-publish.yml
    with:
      runner: self-hosted-x64
      benchmark-command: ./gradlew :vadl:benchmark-iss-aarch32 -i
      artifact-source: vadl/build/iss-benchmarks/a32/normalized-results/a32-open-vadl.csv
      destination-folder: data/iss/aarch32/embench/results
      commit-message: 'data: Pushed ISS aarch32 embench data'
    secrets: inherit

  aarch64:
    uses: ./.github/workflows/reusable-benchmark-publish.yml
    with:
      runner: self-hosted-x64
      benchmark-command: ./gradlew :vadl:benchmark-iss-aarch64 -i
      artifact-source: vadl/build/iss-benchmarks/a64/normalized-results/a64-open-vadl.csv
      destination-folder: data/iss/aarch64/embench/results
      commit-message: 'data: Pushed ISS aarch64 embench data'
    secrets: inherit

  riscv64:
    uses: ./.github/workflows/reusable-benchmark-publish.yml
    with:
      runner: self-hosted-x64
      benchmark-command: ./gradlew :vadl:benchmark-iss-riscv64 -i
      artifact-source: vadl/build/iss-benchmarks/rv64imd/normalized-results/rv64imd-open-vadl.csv
      destination-folder: data/iss/riscv64/embench/results
      commit-message: 'data: Pushed ISS riscv64 embench data'
    secrets: inherit

  vectorbench64:
    uses: ./.github/workflows/reusable-benchmark-publish.yml
    with:
      runner: self-hosted-arm64
      benchmark-command: ./gradlew :vadl:benchmark-iss-vectorbench64 -i
      artifact-source: vadl/build/iss-benchmarks/vectorbench64/normalized-results/vectorbench64-open-vadl.csv
      destination-folder: data/iss/vectorbench64/vecbench/results
      commit-message: 'data: Pushed ISS vectorbench64 benchmark data'
    secrets: inherit
