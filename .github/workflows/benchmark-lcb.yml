name: Benchmark LCB

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'vadl/main/vadl/lcb/**'
      - 'vadl/test/vadl/lcb/**'
      - 'sys/**'

permissions:
  contents: read
  actions: write
  checks: write

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: ./gradlew assemble testClasses -PFailOnWarnings
  riscv32:
    needs: build
    uses: ./.github/workflows/reusable-benchmark-publish.yml
    with:
      runner: self-hosted-x64
      benchmark-command: ./gradlew :vadl:test -i --tests "vadl.lcb.riscv.riscv32.EmbenchBenchmarkRiscv32Test" -Dtags.include=BenchmarkTest
      artifact-source: riscv32.csv
      artifact-name: ${{ github.event.repository.updated_at }}-${{ github.sha }}.csv
      destination-folder: data/lcb/riscv32/instruction-delta/results
      commit-message: 'data: Pushed LCB data'
      extra-env: |
        EMBENCH_BENCHMARK_RESULT_HOST_PATH=${{ github.workspace }}/riscv32.csv
        EMBENCH_BENCHMARK_RESULT_GUEST_PATH=/src/embench/result/executed_instructions_relative.csv
    secrets: inherit
  riscv64:
    needs: build
    uses: ./.github/workflows/reusable-benchmark-publish.yml
    with:
      runner: self-hosted-x64
      benchmark-command: ./gradlew :vadl:test -i --tests "vadl.lcb.riscv.riscv64.EmbenchBenchmarkRiscv64Test" -Dtags.include=BenchmarkTest
      artifact-source: riscv64.csv
      artifact-name: ${{ github.event.repository.updated_at }}-${{ github.sha }}.csv
      destination-folder: data/lcb/riscv64/instruction-delta/results
      commit-message: 'data: Pushed LCB data'
      extra-env: |
        EMBENCH_BENCHMARK_RESULT_HOST_PATH=${{ github.workspace }}/riscv64.csv
        EMBENCH_BENCHMARK_RESULT_GUEST_PATH=/src/embench/result/executed_instructions_relative.csv
    secrets: inherit
