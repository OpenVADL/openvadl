# Adds a draft release to the Github releases by collecting merged PRs
# using the release-drafter action.
name: Draft Release

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-drafter
  cancel-in-progress: true

jobs:
  update-draft-release:
    name: Update Release Draft
    permissions:
      contents: write
      pull-requests: read
    runs-on: self-hosted
    outputs:
      version: ${{ steps.release-drafter.outputs.resolved_version }}
    steps:
      - uses: release-drafter/release-drafter@v6
        id: release-drafter
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          echo "Version: ${{ steps.release-drafter.outputs.resolved_version }}"

  build-and-upload-native:
    needs: update-draft-release
    strategy:
      matrix:
        include:
          - architecture: arm64
            platform: macOS
            runner: self-hosted-arm64
          - architecture: x64
            platform: linux
            runner: self-hosted-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Build Environment
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Native Executable
        run: |
          VERSIONING_GIT_TAG=v${{ needs.update-draft-release.outputs.version }} ./gradlew nativeCompile
          FULLNAME=openvadl-${{ needs.update-draft-release.outputs.version }}-${{ matrix.platform }}-${{ matrix.architecture }}
          mkdir ${FULLNAME}
          mv vadl-cli/build/native/nativeCompile/openvadl ${FULLNAME}/openvadl
          tar -czvf ${FULLNAME}.tar.gz ${FULLNAME}
          echo "COMPRESSED_APP=${FULLNAME}.tar.gz" >> $GITHUB_ENV

      - name: Upload Executable to Draft Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: ${{ env.COMPRESSED_APP }}
          tag_name: v${{ needs.update-draft-release.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-upload-jar:
    needs: update-draft-release
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Build Environment
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Application
        run: |
          VERSIONING_GIT_TAG=v${{ needs.update-draft-release.outputs.version }} ./gradlew distTar
          JAVA_TAR=openvadl-${{ needs.update-draft-release.outputs.version }}.tar
          mv vadl-cli/build/distributions/openvadl.tar $JAVA_TAR
          echo "JAVA_TAR=${JAVA_TAR}" >> $GITHUB_ENV

      - name: Upload Executable to Draft Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            ${{ env.JAVA_TAR }}
          tag_name: v${{ needs.update-draft-release.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # This builds and uploads jlink bundles to the job as artifacts.
  # Note that this doesn't upload it to the draft release.
  build-and-upload-jlink:
    needs: update-draft-release
    runs-on: self-hosted-x64 # container feature is not supported on self-hosted arm64
    container:
      image: ghcr.io/openvadl/java-runtime-builder
      options: --user 998 # run as a github-runner user, otherwise it will create things as root
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Build jlink Images for All Platforms
        run: |
          ./gradlew vadl-cli:jlink -PjlinkAllPlatforms

      - name: Upload linux-arm64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openvadl-linux-arm64
          path: vadl-cli/build/image/*-linux-arm64/
          retention-days: 20

      - name: Upload linux-x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openvadl-linux-x64
          path: vadl-cli/build/image/*-linux-x64/
          retention-days: 20

      - name: Upload macos-arm64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openvadl-macos-arm64
          path: vadl-cli/build/image/*-macos-arm64/
          retention-days: 20

      - name: Upload win-x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openvadl-win-x64
          path: vadl-cli/build/image/*-win-x64/
          retention-days: 20

      - name: Upload win-arm64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openvadl-win-arm64
          path: vadl-cli/build/image/*-win-arm64/
          retention-days: 20
