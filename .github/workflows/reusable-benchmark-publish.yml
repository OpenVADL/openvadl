name: Reusable Benchmark Publish Workflow

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runs-on property'
        required: false
        default: 'self-hosted-x64'
        type: string
      benchmark-command:
        description: 'Command that produces the benchmark artifact'
        required: true
        type: string
      artifact-source:
        description: 'Path to the produced artifact'
        required: true
        type: string
      destination-folder:
        description: 'Destination folder in the target repository'
        required: true
        type: string
      commit-message:
        description: 'Commit message for the pushed artifact'
        required: true
        type: string
      extra-env:
        description: 'Additional environment variables in KEY=VALUE form, one per line'
        required: false
        default: ''
        type: string
      download-artifact:
        description: 'Name of a GitHub Actions artifact to download before benchmarking (optional)'
        required: false
        default: ''
        type: string
      cache-key:
        description: 'Cache key for a pre-built artifact to restore before benchmarking (optional)'
        required: false
        default: ''
        type: string
      cache-path:
        description: 'Path restored from the cache before benchmarking (required when cache-key is set)'
        required: false
        default: ''
        type: string

jobs:
  benchmark:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Restore pre-built cache
        if: ${{ inputs.cache-key != '' }}
        uses: actions/cache/restore@v5
        with:
          key: ${{ inputs.cache-key }}
          path: ${{ inputs.cache-path }}
          fail-on-cache-miss: true
      - name: Make cached artifact executable
        if: ${{ inputs.cache-key != '' }}
        run: chmod +x "${{ inputs.cache-path }}"
      - name: Download pre-built artifact
        if: ${{ inputs.download-artifact != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.download-artifact }}
      - name: Make downloaded artifact executable
        if: ${{ inputs.download-artifact != '' }}
        run: chmod +x ${{ inputs.download-artifact }}
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Set benchmark environment
        if: ${{ inputs.extra-env != '' }}
        run: printf '%s\n' "${{ inputs.extra-env }}" >> "$GITHUB_ENV"
      - name: Run benchmark
        run: ${{ inputs.benchmark-command }}
        env:
          isCI: true
      - name: Set artifact filename
        run: printf 'ARTIFACT_NAME=%s_%s.csv\n' "$(date -u +%Y-%m-%dT%H-%M-%SZ)" "${{ github.sha }}" >> "$GITHUB_ENV"
      - name: Prepare artifact
        run: cp "${{ inputs.artifact-source }}" "${{ github.workspace }}/${ARTIFACT_NAME}"
      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          repository: openVADL/resselpark
          token: ${{ secrets.ACCESS_TOKEN_RESSELPARK }}
          ref: master
          path: resselpark
      - name: Copy artifact into target repository
        run: |
          mkdir -p "${{ github.workspace }}/resselpark/${{ inputs.destination-folder }}"
          cp "${{ github.workspace }}/${ARTIFACT_NAME}" \
            "${{ github.workspace }}/resselpark/${{ inputs.destination-folder }}/${ARTIFACT_NAME}"
      - name: Commit and push artifact
        run: |
          cd "${{ github.workspace }}/resselpark"
          git config user.email "ci@openvadl.org"
          git config user.name "ci"
          git add "${{ inputs.destination-folder }}/${ARTIFACT_NAME}"
          git commit -m "${{ inputs.commit-message }}" || exit 0
          git push origin HEAD:master
