[package]
name = "vadl-cosim-broker"
version = "0.1.0"
edition = "2024"

[dependencies]
cosim-lib = { path = "../cosim-lib" }

anyhow = "1.0.100"

clap = { version = "4.5.51", features = ["derive"] }
figment = { version = "0.10.19", features = ["toml"] }

tracing = { version = "0.1.41", features = ["attributes"] }
tracing-subscriber = "0.3.20"
serde_json = "1.0.145"
