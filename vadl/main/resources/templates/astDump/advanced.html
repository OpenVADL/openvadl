<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced AST Dump</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-clifford: #da373d;
    }

  </style>
</head>
<body class="h-dvh w-full overflow-hidden p-8 bg-stone-50 flex flex-col">
<h1 class="text-3xl shrink-0">Advanced AST Dump</h1>
<p class="shrink-0">
  AST Dump with types generated on [[${timestamp}]].<br>
  In the AST all macros are expanded and validated by the typechecker.
</p>
<div class="flex flex-1 min-h-0 pt-8 gap-4">
  <div class="flex-1 min-w-0 min-h-0 overflow-y-auto rounded-xl p-4 bg-white shadow-xl ring ring-gray-900/5">
    AST
    <div th:fragment="tree(nodes)" class="border-l ml-2 border-gray-200">
      <div th:each="node : ${nodes}">
        <th:block th:with="location=${node.location}">
          <div th:if="${location != null}"
               class="p-2 border-3 border-dashed border-transparent rounded-r-lg cursor-pointer"
               th:id="${node.htmlId}"
               th:attr="data-path=${location.path},
                        data-start-line=${location.startLine},
                        data-start-col=${location.startColumn},
                        data-end-line=${location.endLine},
                        data-end-col=${location.endColumn}"
               onmouseenter="highlight(this)"
               onmouseleave="clearHighlight()"
               onclick="toggleLock(this)">
            <span th:text="${node.description}">Node name</span>
          </div>

          <div th:unless="${location != null}"
               class="p-2 rounded-r-lg"
               th:id="${node.htmlId}">
            <span th:text="${node.description}">Node name</span>
          </div>
        </th:block>

        <div th:if="${!#lists.isEmpty(node.children)}"
            th:replace="~{::tree(${node.children})}">
        </div>
      </div>
    </div>

    <div th:replace="~{ :: tree(${ast})}"></div>
  </div>

  <div class="flex-1 min-w-0 min-h-0 flex flex-col rounded-xl bg-white shadow-xl ring ring-gray-900/5">
    <div class="shrink-0 w-full p-4 border-b border-gray-200 flex items-center justify-between gap-4">
      <span class="flex items-center gap-2">
        <span id="locationName">
         <i>Nothing highlighted</i>
        </span>
        <span id="lockIndicator" class="hidden" title="Location locked"
              aria-label="Location locked">🔒</span>
      </span>
      <div class="shrink-0 flex items-center gap-4">
        <label class="flex items-center gap-2 cursor-pointer">
          <input id="showExpandedFrom" type="checkbox"
                 class="size-4 accent-sky-600">
          <span>Expanded from</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input id="autoScroll" type="checkbox" checked
                 class="size-4 accent-emerald-600">
          <span>Autoscroll</span>
        </label>
      </div>
    </div>
    <div class="flex-1 min-h-0 flex">
      <pre id="lineNumbers"
           class="shrink-0 overflow-hidden p-4 pr-2 text-right font-mono tabular-nums text-gray-400 select-none whitespace-pre"
           aria-hidden="true"></pre>
      <pre id="sourceCode" class="flex-1 min-w-0 min-h-0 overflow-auto p-4 whitespace-pre">[[${source}]]</pre>
    </div>
    <div id="expandedFromPanel"
         class="hidden h-32 shrink-0 overflow-auto p-4 border-t border-gray-200">
      <div id="expandedFromTitle" class="mb-2 font-medium">Expanded from</div>
      <div id="expandedFromList" class="space-y-1 text-sm text-gray-700">
        <i class="text-gray-500">Display disabled</i>
      </div>
    </div>
  </div>
</div>

<script id="expandedFromData" type="application/json">[(${expandedFromData})]</script>
<script>
  const sourceElement = document.getElementById("sourceCode");
  const lineNumbersElement = document.getElementById("lineNumbers");
  const autoScrollElement = document.getElementById("autoScroll");
  const showExpandedFromElement = document.getElementById("showExpandedFrom");
  const lockIndicatorElement = document.getElementById("lockIndicator");
  const expandedFromPanelElement = document.getElementById("expandedFromPanel");
  const expandedFromTitleElement = document.getElementById("expandedFromTitle");
  const expandedFromListElement = document.getElementById("expandedFromList");
  const source = sourceElement.textContent;
  // Entries are [start, end, node id, AST depth, greatest end up to this entry].
  // They are generated and sorted in Java to avoid scanning the AST DOM on page load.
  const sourceIndex = [(${sourceIndex})];
  lineNumbersElement.textContent = Array.from(
          {length: source.split("\n").length},
          (_, index) => index + 1
  ).join("\n");
  let activeNodeElement = null;
  let lockedNodeElement = null;
  let sourceHoverFrame = null;
  let pendingSourceHover = null;
  let parsedExpandedFromData = null;

  // Assumes lines and columns are 1-based, and end is exclusive.
  function offsetAt(line, column) {
    const lines = source.split("\n");

    const safeLine = Math.max(1, Math.min(line, lines.length));
    const lineStart = lines
            .slice(0, safeLine - 1)
            .reduce((offset, currentLine) => offset + currentLine.length + 1, 0);

    const safeColumn = Math.max(
            1,
            Math.min(column, lines[safeLine - 1].length + 1)
    );

    return lineStart + safeColumn - 1;
  }

  function locationOf(element) {
    return {
      path: element.dataset.path,
      startLine: Number(element.dataset.startLine),
      startColumn: Number(element.dataset.startCol),
      endLine: Number(element.dataset.endLine),
      endColumn: Number(element.dataset.endCol)
    };
  }

  function sourceRange(location, type) {
    return {
      start: offsetAt(location.startLine, location.startColumn),
      end: Math.min(
              source.length,
              offsetAt(location.endLine, location.endColumn) + 1
      ),
      type
    };
  }

  function formatLocation(location) {
    return `${location.path}:${location.startLine}:${location.startColumn}`
            + ` - ${location.endLine}:${location.endColumn}`;
  }

  function expandedFromMessage(message) {
    const text = document.createElement("i");
    text.className = "text-gray-500";
    text.textContent = message;
    expandedFromListElement.replaceChildren(text);
  }

  function renderExpandedFrom(locations) {
    if (!showExpandedFromElement.checked) {
      expandedFromTitleElement.textContent = "Expanded from";
      expandedFromMessage("Display disabled");
      return;
    }

    expandedFromTitleElement.textContent = `Expanded from (${locations.length})`;
    if (locations.length === 0) {
      expandedFromMessage("No macro expansion");
      return;
    }

    const entries = locations.map(location => {
      const entry = document.createElement("div");
      entry.className = "flex items-start gap-2 font-mono";

      const marker = document.createElement("span");
      marker.className = "mt-1.5 size-2 shrink-0 rounded-full bg-sky-200";

      const text = document.createElement("span");
      text.textContent = formatLocation(location);

      entry.append(marker, text);
      return entry;
    });
    expandedFromListElement.replaceChildren(...entries);
  }

  function expandedLocationsOf(nodeElement) {
    if (parsedExpandedFromData === null) {
      parsedExpandedFromData = JSON.parse(
              document.getElementById("expandedFromData").textContent
      );
    }

    const nodeId = Number(nodeElement.id.substring("ast-node-".length));
    const entries = parsedExpandedFromData[1];
    let lower = 0;
    let upper = entries.length;
    while (lower < upper) {
      const middle = Math.floor((lower + upper) / 2);
      if (entries[middle][0] < nodeId) {
        lower = middle + 1;
      } else {
        upper = middle;
      }
    }

    if (lower >= entries.length || entries[lower][0] !== nodeId) {
      return [];
    }

    const paths = parsedExpandedFromData[0];
    const entry = entries[lower];
    const locations = [];
    for (let index = 1; index < entry.length; index += 5) {
      locations.push({
        path: paths[entry[index]],
        startLine: entry[index + 1],
        startColumn: entry[index + 2],
        endLine: entry[index + 3],
        endColumn: entry[index + 4]
      });
    }
    return locations;
  }

  function activateAstNode(nodeElement) {
    if (activeNodeElement !== null && activeNodeElement !== nodeElement) {
      activeNodeElement.classList.remove("bg-emerald-100");
    }
    activeNodeElement = nodeElement;
    activeNodeElement.classList.add("bg-emerald-100");

    const location = locationOf(nodeElement);
    document.getElementById("locationName").textContent = formatLocation(location);
    renderExpandedFrom(showExpandedFromElement.checked
            ? expandedLocationsOf(nodeElement)
            : []);
  }

  function highlight(nodeElement, scrollSource = true) {
    if (lockedNodeElement !== null && nodeElement !== lockedNodeElement) {
      return;
    }

    activateAstNode(nodeElement);
    const location = locationOf(nodeElement);
    const primaryRange = sourceRange(location, "primary");
    const expandedLocations = showExpandedFromElement.checked
            ? expandedLocationsOf(nodeElement)
            : [];

    if (primaryRange.end <= primaryRange.start) {
      sourceElement.textContent = source;
      return;
    }

    const expandedRanges = showExpandedFromElement.checked
            ? expandedLocations
            // The source pane can only highlight locations from the current file.
            .filter(expandedLocation => expandedLocation.path === location.path)
            .map(expandedLocation => sourceRange(expandedLocation, "expanded"))
            .filter(range => range.end > range.start)
            : [];

    const ranges = [primaryRange, ...expandedRanges];
    const boundaries = Array.from(new Set([
      0,
      source.length,
      ...ranges.flatMap(range => [range.start, range.end])
    ])).sort((left, right) => left - right);

    const content = document.createDocumentFragment();
    let primaryMark = null;

    for (let index = 0; index < boundaries.length - 1; index++) {
      const start = boundaries[index];
      const end = boundaries[index + 1];
      const matchingRanges = ranges.filter(range =>
              range.start <= start && range.end >= end
      );
      const type = matchingRanges.some(range => range.type === "primary")
              ? "primary"
              : matchingRanges.length > 0 ? "expanded" : null;

      if (type === null) {
        content.append(document.createTextNode(source.slice(start, end)));
        continue;
      }

      const mark = document.createElement("mark");
      mark.className = type === "primary"
              ? "bg-emerald-100 rounded"
              : "bg-sky-100 rounded";
      mark.textContent = source.slice(start, end);
      content.append(mark);

      if (type === "primary" && primaryMark === null) {
        primaryMark = mark;
      }
    }

    sourceElement.replaceChildren(content);

    if (scrollSource && autoScrollElement.checked && primaryMark !== null) {
      primaryMark.scrollIntoView({
        behavior: "smooth",
        block: "center",
        inline: "nearest"
      });
    }
  }

  function clearHighlight() {
    if (lockedNodeElement !== null) {
      return;
    }

    if (activeNodeElement !== null) {
      activeNodeElement.classList.remove("bg-emerald-100");
    }
    activeNodeElement = null;
    sourceElement.textContent = source;
    document.getElementById("locationName").innerHTML =
            "<i>Nothing highlighted</i>";
    if (showExpandedFromElement.checked) {
      expandedFromTitleElement.textContent = "Expanded from";
      expandedFromMessage("Nothing highlighted");
    } else {
      renderExpandedFrom([]);
    }
  }

  function sourceOffsetFromPoint(x, y) {
    let offsetNode;
    let offset;
    if (document.caretPositionFromPoint) {
      const position = document.caretPositionFromPoint(x, y);
      if (position === null) {
        return null;
      }
      offsetNode = position.offsetNode;
      offset = position.offset;
    } else if (document.caretRangeFromPoint) {
      const caretRange = document.caretRangeFromPoint(x, y);
      if (caretRange === null) {
        return null;
      }
      offsetNode = caretRange.startContainer;
      offset = caretRange.startOffset;
    } else {
      return null;
    }

    if (offsetNode !== sourceElement && !sourceElement.contains(offsetNode)) {
      return null;
    }

    const range = document.createRange();
    range.selectNodeContents(sourceElement);
    try {
      range.setEnd(offsetNode, offset);
    } catch (error) {
      return null;
    }
    return range.toString().length;
  }

  function sourceIndexEntryAt(offset) {
    let lower = 0;
    let upper = sourceIndex.length;
    while (lower < upper) {
      const middle = Math.floor((lower + upper) / 2);
      if (sourceIndex[middle][0] <= offset) {
        lower = middle + 1;
      } else {
        upper = middle;
      }
    }

    let best = null;
    for (let index = lower - 1; index >= 0; index--) {
      const entry = sourceIndex[index];
      if (entry[4] <= offset) {
        break;
      }
      if (entry[0] > offset || entry[1] <= offset) {
        continue;
      }

      if (best === null
              || entry[1] - entry[0] < best[1] - best[0]
              || (entry[1] - entry[0] === best[1] - best[0]
                      && entry[3] > best[3])
              || (entry[1] - entry[0] === best[1] - best[0]
                      && entry[3] === best[3] && entry[2] < best[2])) {
        best = entry;
      }
    }
    return best;
  }

  function highlightFromSource(x, y) {
    if (lockedNodeElement !== null) {
      return;
    }

    const offset = sourceOffsetFromPoint(x, y);
    const entry = offset === null ? null : sourceIndexEntryAt(offset);
    if (entry === null) {
      if (activeNodeElement !== null) {
        clearHighlight();
      }
      return;
    }

    const nodeElement = document.getElementById(`ast-node-${entry[2]}`);
    if (nodeElement === null || activeNodeElement === nodeElement) {
      return;
    }

    highlight(nodeElement, false);
    if (autoScrollElement.checked) {
      nodeElement.scrollIntoView({
        behavior: "auto",
        block: "nearest",
        inline: "nearest"
      });
    }
  }

  function queueSourceHighlight(event) {
    if (lockedNodeElement !== null) {
      return;
    }
    pendingSourceHover = {x: event.clientX, y: event.clientY};
    if (sourceHoverFrame !== null) {
      return;
    }

    sourceHoverFrame = requestAnimationFrame(() => {
      sourceHoverFrame = null;
      const point = pendingSourceHover;
      pendingSourceHover = null;
      if (point !== null) {
        highlightFromSource(point.x, point.y);
      }
    });
  }

  function toggleLock(nodeElement) {
    if (lockedNodeElement !== null && lockedNodeElement !== nodeElement) {
      return;
    }

    if (lockedNodeElement === nodeElement) {
      lockedNodeElement.classList.remove("border-emerald-500");
      lockedNodeElement.classList.add("border-transparent");
      lockedNodeElement = null;
      lockIndicatorElement.classList.add("hidden");
      return;
    }

    lockedNodeElement = nodeElement;
    lockedNodeElement.classList.remove("border-transparent");
    lockedNodeElement.classList.add("border-emerald-500");
    lockIndicatorElement.classList.remove("hidden");
    highlight(lockedNodeElement);
  }

  function syncExpandedFromDisplay() {
    expandedFromPanelElement.classList.toggle(
            "hidden",
            !showExpandedFromElement.checked
    );

    if (activeNodeElement !== null) {
      highlight(activeNodeElement);
    } else {
      clearHighlight();
    }
  }

  showExpandedFromElement.addEventListener("change", syncExpandedFromDisplay);
  sourceElement.addEventListener("pointermove", queueSourceHighlight);
  sourceElement.addEventListener("pointerleave", clearHighlight);
  sourceElement.addEventListener("scroll", () => {
    lineNumbersElement.scrollTop = sourceElement.scrollTop;
  });
  window.addEventListener("pageshow", syncExpandedFromDisplay);
  syncExpandedFromDisplay();
</script>
</body>
</html>
