cflags = [
    '-c',
    '-O2',
    '-ffreestanding',
    '-ffunction-sections',
    '-specs=nosys.specs',
    '-marm',
    '-march=armv6',
    '-mfloat-abi=soft',
    '-mno-unaligned-access',
]
ldflags = [
    '-static',
    '-O2',
    '-nostartfiles',
    '-nostdlib',
    '-Wl,-gc-sections',
    '-specs=nosys.specs',
    '-T../../../config/aarch32/boards/virt-iss/link.ld',
]
user_libs = [
    '-lm',
    '-lgcc',
]
dummy_libs = ['memset', 'memcpy', 'memcmp', 'memmove', 'assert', 'str']

cpu_mhz = 10
