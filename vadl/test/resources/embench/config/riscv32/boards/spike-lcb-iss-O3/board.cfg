cc = '/src/embench/lcbw32/lcb-wrapper-asm-rv32crc'
cflags = [
    '-O3',
    '-nostdlib',
    '-ffreestanding',
    '-fno-builtin',
    '-nostdinc',
    '-isystem/src/llvm-final/build/lib/clang/19/include',
    '-isystem/src/embench/lib-stubs',
]

ld = '/src/embench/lcbw32/lcb-ld-wrapper-rv32'
ldflags = [
    '-static',
    '-T../../../config/riscv32/boards/spike-lcb-iss-O3/link.ld',
]
user_libs = []
cpu_mhz = 1

